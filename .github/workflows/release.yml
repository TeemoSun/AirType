name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Test
        run: go test ./...
      # .syso（图标/manifest）已提交在各 cmd 目录，go build 自动嵌入
      - name: Build AirType.exe
        env:
          CGO_ENABLED: '0'
        run: >
          go build -trimpath
          -ldflags "-H windowsgui -s -w -X main.version=${{ github.ref_name }}"
          -o AirType.exe ./cmd/airtype
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: AirType.exe
          generate_release_notes: true

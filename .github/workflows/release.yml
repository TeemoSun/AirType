name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Test
        run: go test ./...
      # PE 版本资源从 tag 现算（仓库里提交的 .syso 是开发版，版本号固定 1.0.0.0）
      - name: Generate version resources from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          go run github.com/tc-hib/go-winres@v0.1.1 make --in winres/winres.json --out cmd/airtype/rsrc --file-version $v --product-version $v
      - name: Build AirType.exe
        env:
          CGO_ENABLED: '0'
        run: >
          go build -trimpath
          -ldflags "-H windowsgui -s -w -X main.version=${{ github.ref_name }}"
          -o AirType.exe ./cmd/airtype
      - name: Checksum
        shell: pwsh
        run: |
          (Get-FileHash AirType.exe -Algorithm SHA256).Hash.ToLower() + "  AirType.exe" | Out-File -Encoding ascii AirType.exe.sha256
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AirType.exe
            AirType.exe.sha256
          generate_release_notes: true
